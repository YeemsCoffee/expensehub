services:
  # PostgreSQL Database
  - type: pserv
    name: expensehub-db
    plan: free
    databaseName: expensehub
    databaseUser: expensehub_user

  # Web Service (Backend + Frontend)
  - type: web
    name: expensehub
    runtime: node
    plan: free
    rootDirectory: .
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: expensehub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REACT_APP_API_URL
        value: /api
      - key: FRONTEND_URL
        sync: false
      - key: AMAZON_PUNCHOUT_IDENTITY
        sync: false
      - key: AMAZON_PUNCHOUT_SECRET
        sync: false
      - key: AMAZON_PUNCHOUT_URL
        value: https://abintegrations.amazon.com/punchout
      - key: AMAZON_PUNCHOUT_TEST_URL
        value: https://abintegrations.amazon.com/punchout/test
      - key: AMAZON_PO_URL
        value: https://https-ats.amazonsedi.com/8527371a-bf41-41c6-b7e1-2f6c72f09d00
      # Must be "true" or all OrderRequests are sent with deploymentMode="test"
      # and Amazon Business holds/cancels them instead of fulfilling.
      - key: AMAZON_PUNCHOUT_USE_PROD
        value: "true"
      # Public URL Amazon posts the punchout cart back to (e.g. https://expensehub.onrender.com)
      - key: AMAZON_PUNCHOUT_RETURN_URL
        sync: false
      # Company billing address — required for Amazon to auto-approve orders.
      # Without a real billing address, orders sit in Amazon's approval queue.
      - key: COMPANY_BILL_NAME
        sync: false
      - key: COMPANY_BILL_STREET
        sync: false
      - key: COMPANY_BILL_CITY
        sync: false
      - key: COMPANY_BILL_STATE
        sync: false
      - key: COMPANY_BILL_ZIP
        sync: false
      # Default shipping address fallback (used when an expense has no location)
      - key: COMPANY_SHIP_STREET
        sync: false
      - key: COMPANY_SHIP_CITY
        sync: false
      - key: COMPANY_SHIP_STATE
        sync: false
      - key: COMPANY_SHIP_ZIP
        sync: false
    healthCheckPath: /api/health
